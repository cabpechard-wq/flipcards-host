<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Accès abonnés — Flipcards</title>
<style>
  :root { --ink:#1a1a1a; --muted:#6b7280; --accent:#1f4f7a; --bg:#ffffff; --card:#fff; --border:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(1200px 600px at 10% 0%, #e8f1f7 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 100%, #faf0e8 0%, var(--bg) 50%);
    color: var(--ink); padding: 1.5rem; }
  .box { width:min(420px,100%); background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.75rem; }
  h1 { font-size:1.35rem; margin:0 0 .35rem; }
  p { margin:0 0 1rem; color:var(--muted); font-family: system-ui, sans-serif; font-size:.95rem; line-height:1.45; }
  label { display:block; font-family:system-ui,sans-serif; font-size:.8rem; font-weight:600; margin-bottom:.35rem; }
  input { width:100%; padding:.7rem .8rem; border:1px solid var(--border); border-radius:8px; font-size:1rem; }
  button { margin-top:.9rem; width:100%; border:0; border-radius:8px; padding:.75rem 1rem; background:var(--accent); color:#fff;
    font-family:system-ui,sans-serif; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.05); }
  .err { color:#b91c1c; font-family:system-ui,sans-serif; font-size:.85rem; min-height:1.2em; margin-top:.5rem; }
  .links { margin-top:1.1rem; font-family:system-ui,sans-serif; font-size:.9rem; line-height:1.6; }
  .links a { color:var(--accent); }
</style>
</head>
<body>
  <form class="box" id="gate" autocomplete="off">
    <h1>Accès abonnés</h1>
    <p>Flipcards complètes — réservées aux abonnés. Parcours normal : <a href="../membre/">connexion email + mot de passe</a>. Ci-dessous : accès admin (mdp partagé).</p>
    <label for="pw">Mot de passe admin</label>
    <input id="pw" name="pw" type="password" required autofocus>
    <button type="submit">Ouvrir les flipcards</button>
    <div class="err" id="err"></div>
    <div class="links">
      Pas encore abonné ?<br>
      <a href="../demo/">Essayer la démo (gratuit)</a><br>
      <a href="../checkout/">S’abonner</a><br>
      <a href="../membre/">Connexion membre (email + mdp)</a>
    </div>
  </form>
<script>
const HASH = "655158b84f111b61d21fde029a5402c0f3d07391008582e08fc92bc129d86f4c";
async function sha256(text) {
  const data = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}
const form = document.getElementById("gate");
const err = document.getElementById("err");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";
  const pw = document.getElementById("pw").value;
  const h = await sha256(pw);
  if (h !== HASH) { err.textContent = "Mot de passe incorrect."; return; }
  sessionStorage.setItem("flipcards_ok", "1");
  location.replace("./app.html");
});
</script>
</body>
</html>
