<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Connexion — Flipcards</title>
<style>
:root { --ink:#1a1a1a; --muted:#6b7280; --accent:#0f766e; --bg:#f8faf9; --card:#fff; --border:#e5e7eb; }
body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,sans-serif;
  background: radial-gradient(900px 500px at 10% 0%, #d1fae5, var(--bg)); color:var(--ink); padding:1.5rem; }
.box { width:min(440px,100%); background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.5rem; }
h1 { font-family: Georgia, serif; font-size:1.35rem; margin:0 0 .4rem; }
p { color:var(--muted); line-height:1.45; }
label { display:block; margin:.75rem 0 .35rem; font-size:.9rem; color:var(--ink); }
input { width:100%; padding:.7rem .8rem; border:1px solid var(--border); border-radius:8px; font-size:1rem; box-sizing:border-box; }
button { margin-top:1rem; width:100%; border:0; border-radius:8px; padding:.75rem 1rem; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
.err { color:#b91c1c; min-height:1.2em; font-size:.9rem; margin-top:.5rem; }
.links { font-size:.85rem; margin-top:1rem; line-height:1.7; }
.links a { color:var(--accent); }
</style>
</head>
<body>
  <div class="box">
    <h1>Connexion membre</h1>
    <p>E-mail Stripe + mot de passe choisi après paiement.</p>
    <form id="f" autocomplete="on">
      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="username">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" required minlength="4" autocomplete="current-password">
      <label style="display:flex;align-items:center;gap:.4rem;font-weight:400;color:var(--muted)">
        <input type="checkbox" id="remember" checked style="width:auto"> Rester connecté sur cet appareil
      </label>
      <button type="submit">Se connecter</button>
      <div class="err" id="err"></div>
    </form>
    <div class="links">
      <a href="./forgot/">Mot de passe oublié</a><br>
      <a href="./compte/">Modifier le mot de passe</a><br>
      <a href="../checkout/">Pas encore abonné ?</a>
    </div>
  </div>
<script>
(function () {
  var BASE = "https://flipcards-auth.cab-pechard.workers.dev";
  var TOKEN_KEY = "flipcards_token";
  function getToken() {
    return sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY) || "";
  }
  function setToken(token, remember) {
    sessionStorage.setItem(TOKEN_KEY, token);
    sessionStorage.setItem("flipcards_ok", "1");
    if (remember) localStorage.setItem(TOKEN_KEY, token);
    else localStorage.removeItem(TOKEN_KEY);
  }
  function clearToken() {
    sessionStorage.removeItem(TOKEN_KEY);
    sessionStorage.removeItem("flipcards_ok");
    localStorage.removeItem(TOKEN_KEY);
  }
  async function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    var token = getToken();
    if (token && !headers.Authorization) headers.Authorization = "Bearer " + token;
    var res = await fetch(String(BASE).replace(/\/$/, "") + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    var data = {};
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) {
      var err = new Error(data.error || ("Erreur " + res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }
  window.FLIPCARDS_AUTH = { api: api, setToken: setToken, clearToken: clearToken, getToken: getToken };

  (async function () {
    var q = new URLSearchParams(location.search);
    if (q.get("email")) document.getElementById("email").value = q.get("email");
    try {
      if (getToken()) {
        await api("/api/me");
        location.replace("../gada/app.html");
        return;
      }
    } catch (_) { clearToken(); }

    document.getElementById("f").addEventListener("submit", async function (e) {
      e.preventDefault();
      var errEl = document.getElementById("err");
      errEl.textContent = "";
      try {
        var data = await api("/api/login", {
          method: "POST",
          body: {
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("pw").value,
          },
        });
        setToken(data.token, document.getElementById("remember").checked);
        location.replace("../gada/app.html");
      } catch (ex) {
        errEl.textContent = ex.message || "Erreur";
      }
    });
  })();
})();
</script>
</body>
</html>
