<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache"><title>Connexion — Flipcards</title>
<style>
:root { --ink:#1a1a1a; --muted:#6b7280; --accent:#0f766e; --bg:#f8faf9; --card:#fff; --border:#e5e7eb; }
body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,sans-serif;
  background: radial-gradient(900px 500px at 10% 0%, #d1fae5, var(--bg)); color:var(--ink); padding:1.5rem; }
.box { width:min(440px,100%); background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.5rem; }
h1 { font-family: Georgia, serif; font-size:1.35rem; margin:0 0 .4rem; }
p { color:var(--muted); line-height:1.45; }
label { display:block; margin:.75rem 0 .35rem; font-size:.9rem; color:var(--ink); }
input { width:100%; padding:.7rem .8rem; border:1px solid var(--border); border-radius:8px; font-size:1rem; box-sizing:border-box; }
button { margin-top:1rem; display:inline-block; width:100%; text-align:center; border:0; border-radius:8px;
  padding:.75rem 1rem; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
.err { color:#b91c1c; min-height:1.2em; font-size:.9rem; margin-top:.5rem; }
</style>
</head>
<body>
  <div class="box" id="login">
    <h1>Connexion membre</h1>
    <p>E-mail utilisé chez Stripe + mot de passe d’accès (communiqué après activation du compte).</p>
    <form id="f" autocomplete="on">
      <label for="email">E-mail</label>
      <input id="email" type="email" required placeholder="prenom@univ.fr" autocomplete="username">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" required autocomplete="current-password">
      <button type="submit">Se connecter</button>
      <div class="err" id="err"></div>
    </form>
    <p style="font-size:.85rem;margin-top:1rem"><a href="../checkout/">Pas encore abonné ?</a></p>
  </div>
<script>
const ALLOW = {"antonin.pechard@gmail.com": {"statut": "actif", "offre": "test", "hash": "2e0749caeda254dc4599ea85ff4669f9024d48464230612daf5f806c4ddd8270"}, "test-e2e@flipcards.local": {"statut": "essai", "offre": "mensuel", "hash": "a166050c60e56943a0eafbece453d30449aa76d669c3e38069ca93246e2c5986"}};
async function sha256(text) {
  const data = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}
const form = document.getElementById('f');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pw = document.getElementById('pw').value;
  const row = ALLOW[email];
  if (!row || !['actif','essai'].includes(row.statut) || !row.hash) {
    err.textContent = 'Identifiants incorrects ou abonnement inactif.';
    return;
  }
  const h = await sha256(pw);
  if (h !== row.hash) {
    err.textContent = 'Identifiants incorrects ou abonnement inactif.';
    return;
  }
  sessionStorage.setItem('flipcards_member', email);
  sessionStorage.setItem('flipcards_ok', '1');
  location.replace('../gada/app.html');
});
</script>
</body>
</html>
