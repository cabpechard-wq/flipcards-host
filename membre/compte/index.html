<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Modifier le mot de passe — Flipcards</title>
<style>
:root { --ink:#1a1a1a; --muted:#6b7280; --accent:#0f766e; --bg:#f8faf9; --card:#fff; --border:#e5e7eb; }
body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,sans-serif;
  background: radial-gradient(900px 500px at 10% 0%, #d1fae5, var(--bg)); color:var(--ink); padding:1.5rem; }
.box { width:min(440px,100%); background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.5rem; }
h1 { font-family: Georgia, serif; font-size:1.3rem; }
p { color:var(--muted); }
label { display:block; margin:.75rem 0 .35rem; }
input { width:100%; padding:.7rem .8rem; border:1px solid var(--border); border-radius:8px; box-sizing:border-box; }
button { margin-top:1rem; width:100%; border:0; border-radius:8px; padding:.75rem 1rem; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
.err { color:#b91c1c; }
.ok { color:#047857; }
a { color:var(--accent); }
</style>
</head>
<body>
<div class="box">
  <h1>Modifier le mot de passe</h1>
  <p id="who">Connexion requise…</p>
  <form id="f" class="hidden">
    <label for="old">Ancien mot de passe</label>
    <input id="old" type="password" required autocomplete="current-password">
    <label for="pw">Nouveau (min. 4)</label>
    <input id="pw" type="password" minlength="4" required autocomplete="new-password">
    <label for="pw2">Confirmer</label>
    <input id="pw2" type="password" minlength="4" required autocomplete="new-password">
    <button type="submit">Enregistrer</button>
  </form>
  <div id="msg" style="margin-top:.8rem;font-size:.92rem"></div>
  <p style="margin-top:1rem;font-size:.85rem"><a href="../">Connexion</a> · <a href="../../gada/app.html">Flipcards</a></p>
</div>
<script src="../../auth.js"></script>
<script>
(async function () {
  const who = document.getElementById("who");
  const me = await FLIPCARDS_AUTH.requireSession();
  if (!me) {
    who.innerHTML = 'Connecte-toi d’abord : <a href="../">espace abonné</a>.';
    return;
  }
  who.textContent = "Compte : " + me.email;
  document.getElementById("f").classList.remove("hidden");

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    msg.textContent = "";
    const pw = document.getElementById("pw").value;
    const pw2 = document.getElementById("pw2").value;
    if (pw.length < 4) { msg.className = "err"; msg.textContent = "4 caractères minimum."; return; }
    if (pw !== pw2) { msg.className = "err"; msg.textContent = "Confirmation différente."; return; }
    try {
      const data = await FLIPCARDS_AUTH.api("/api/change-password", {
        method: "POST",
        body: {
          old_password: document.getElementById("old").value,
          new_password: pw,
        },
      });
      FLIPCARDS_AUTH.setToken(data.token, true);
      msg.className = "ok";
      msg.textContent = "Mot de passe mis à jour.";
    } catch (ex) {
      msg.className = "err";
      msg.textContent = ex.message || "Erreur";
    }
  });
})();
</script>
<style>.hidden{display:none!important}</style>
</body>
</html>
