<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mot de passe oublié — Flipcards</title>
<style>
:root { --ink:#1a1a1a; --muted:#6b7280; --accent:#0f766e; --bg:#f8faf9; --card:#fff; --border:#e5e7eb; }
body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,sans-serif;
  background: radial-gradient(900px 500px at 10% 0%, #d1fae5, var(--bg)); color:var(--ink); padding:1.5rem; }
.box { width:min(440px,100%); background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.5rem; }
h1 { font-family: Georgia, serif; font-size:1.3rem; margin:0 0 .4rem; }
p { color:var(--muted); }
label { display:block; margin:.75rem 0 .35rem; }
input { width:100%; padding:.7rem .8rem; border:1px solid var(--border); border-radius:8px; box-sizing:border-box; }
button { margin-top:1rem; width:100%; border:0; border-radius:8px; padding:.75rem 1rem; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
.msg { margin-top:.8rem; font-size:.92rem; }
.err { color:#b91c1c; }
.ok { color:#047857; }
a { color:var(--accent); }
</style>
</head>
<body>
<div class="box">
  <h1>Mot de passe oublié</h1>
  <p>Entre l’e-mail utilisé chez Stripe. Tu recevras un lien de réinitialisation (valable 1 h).</p>
  <form id="f">
    <label for="email">E-mail</label>
    <input id="email" type="email" required autocomplete="email">
    <button type="submit">Envoyer le lien</button>
  </form>
  <div class="msg" id="msg"></div>
  <p style="margin-top:1rem;font-size:.85rem"><a href="../">Retour connexion</a></p>
</div>
<script src="../../auth.js?v=2"></script>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.className = "msg";
  msg.textContent = "Envoi…";
  try {
    const data = await FLIPCARDS_AUTH.api("/api/forgot", {
      method: "POST",
      body: { email: document.getElementById("email").value.trim() },
    });
    msg.className = "msg ok";
    msg.textContent = data.message || "Si un compte existe, un e-mail a été envoyé.";
  } catch (ex) {
    msg.className = "msg err";
    msg.textContent = ex.message || "Erreur";
  }
});
</script>
</body>
</html>
